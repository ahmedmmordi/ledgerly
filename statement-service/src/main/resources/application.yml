spring:
  application:
    name: statement-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/statement_db}
    database: ${MONGODB_DATABASE:statement_db}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

server:
  port: 8083
  shutdown: graceful

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger
  api-docs:
    path: /api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

statement:
  kafka:
    topics:
      transfers: ${KAFKA_TOPIC_TRANSFERS:ledger.transfers.v1}
      transfers-dlt: ${KAFKA_TOPIC_TRANSFERS_DLT:ledger.transfers.v1.DLT}
    consumer:
      group-id: ${KAFKA_STATEMENT_CONSUMER_GROUP:statement-service}
