spring:
  application:
    name: statement-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/statement_db}
    database: ${MONGODB_DATABASE:statement_db}
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  port: 8083
  shutdown: graceful

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger
  api-docs:
    path: /api-docs
