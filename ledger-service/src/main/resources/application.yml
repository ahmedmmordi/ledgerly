spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: LedgerService-HikariCP
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: ${DB_BATCH_FETCH_SIZE:20}
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    admin:
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:true}

server:
  port: 8082
  shutdown: graceful

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /swagger
  api-docs:
    path: /api-docs

ledger:
  idempotency:
    ttl: ${LEDGER_IDEMPOTENCY_TTL:24h}
  kafka:
    topics:
      transfers: ${KAFKA_TOPIC_TRANSFERS:ledger.transfers.v1}
  outbox:
    poller:
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_POLLER_DELAY_MS:1000}
      batch-size: ${OUTBOX_POLLER_BATCH_SIZE:50}
      max-retries: ${OUTBOX_POLLER_MAX_RETRIES:3}
      send-timeout-seconds: ${OUTBOX_POLLER_TIMEOUT_SECONDS:5}
